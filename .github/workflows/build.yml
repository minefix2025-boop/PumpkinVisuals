name: Build PumpkinVisuals

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: PumpkinVisuals-Minecraft-1.21.6
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
